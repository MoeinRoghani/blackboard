site_name: blackboardx
site_description: A skeletal blackboard system for Python.
site_url: https://moeinroghani.github.io/blackboard/
repo_url: https://github.com/MoeinRoghani/blackboard
copyright: Licensed under the Apache License, Version 2.0.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - API reference: api.md
  - Contributing: contributing.md
  - Decisions:
      - Project scope: adr/0001-scope.md
      - Control component and model creation: adr/0002-control-component-design.md
      - Delivery failures and stale timers: adr/0003-delivery-and-stale-timers.md
      - Distribution name: adr/0004-distribution-name.md
      - Publishing to PyPI: adr/0005-publishing.md
      - The documentation site: adr/0006-documentation-site.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

watch:
  - src
  - README.md
  - CONTRIBUTING.md
